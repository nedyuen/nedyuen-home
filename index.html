<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ned Yuen</title>
  <meta
    name="description"
    content="Ned's Projects."
  />

  <meta property="og:title" content="Ned Yuen" />
  <meta
    property="og:description"
    content="Projects Repository"
  />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f7f6f2;
      --text: #171717;
      --muted: #6f6f6a;
      --line: #deddd7;
      --card: #ffffff;
      --card-hover: #f1f0eb;
      --accent: #1d1d1b;
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(calc(100% - 48px), var(--max-width));
      margin: 0 auto;
    }

    /* Navigation */

    nav {
      padding: 28px 0;
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .nav-label {
      color: var(--muted);
      font-size: 14px;
    }

    /* Intro */

    .intro {
      min-height: 72vh;
      display: flex;
      align-items: center;
      padding: 80px 0 100px;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 100px;
      align-items: center;
    }

    .hero-content {
      max-width: 850px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(64px, 10vw, 126px);
      font-weight: 500;
      letter-spacing: -0.055em;
      line-height: 0.95;
      margin-left: -7px;
    }

    .hero-description {
      max-width: 570px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.65;
      margin-top: 38px;
    }

    /* About */

    .about-content {
      max-width: 570px;
    }

    .about-label {
      color: var(--muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
    }

    .about-text {
      font-family: "Playfair Display", serif;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.25;
      letter-spacing: -0.035em;
    }

    /* Footer */

    footer {
      border-top: 1px solid var(--line);
      padding: 25px 0;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
    }

    /* Mobile */

    @media (max-width: 800px) {
      .container {
        width: min(calc(100% - 32px), var(--max-width));
      }

      .intro {
        min-height: auto;
        padding: 100px 0 90px;
      }

      .intro-grid {
        grid-template-columns: 1fr;
        gap: 80px;
        text-align: center;
      }

      .hero-content,
      .about-content {
        max-width: 100%;
        margin: 0 auto;
      }

      h1 {
        font-size: clamp(58px, 17vw, 100px);
        margin-left: 0;
      }

      .hero-description {
        margin-left: auto;
        margin-right: auto;
        font-size: 18px;
      }

      .about-text {
        font-size: 32px;
      }

      .site-grid {
        grid-template-columns: 1fr;
      }

      .site-card {
        min-height: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .site-card,
      .arrow {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo">Ned Yuen</a>
      <span class="nav-label">Personal website</span>
    </div>
  </nav>

  <main>

    <!-- Intro -->
    <section class="intro">
      <div class="container intro-grid">

        <div class="hero-content">

          <div class="eyebrow">
            Projects Repository
          </div>

          <h1>
            Ned<br />
            Yuen
          </h1>

          <p class="hero-description">
            A personal space for my projects.
          </p>

        </div>

        <div class="about-content">

          <div class="about-label">
            About
          </div>

          <p class="about-text">
            I'm Ned Yuen. This site brings together
            the different sides of what I do, what I've
            worked on, and what I'm passionate about.
          </p>

        </div>

      </div>
    </section>




  </main>

  <footer>
    <div class="container footer-inner">
      <span>© <span id="year"></span> Ned Yuen</span>
      <span>nedyuen.com</span>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
